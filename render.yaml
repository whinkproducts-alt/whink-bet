services:
  - type: web
    name: whink-bet
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: WHINK Bet
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: /tmp/whink-bet.db
      - key: NEXT_PUBLIC_APP_URL
        value: https://whink-bet.onrender.com
